[project]
name = "transferformance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Quoc-Thinh NGUYEN", email = "nqthinh04@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "deptry>=0.25.1",
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "streamlit>=1.67.0",
]

[project.scripts]
transferformance = "transferformance:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
